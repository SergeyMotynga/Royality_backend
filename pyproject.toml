[tool.poetry]
name = "finguru-backend"
version = "0.1.0"
description = "FinGuru backend service"
authors = ["FinGuru Team <team@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic-settings = "^2.11.0"
sqlalchemy = "^2.0.43"
alembic = "^1.16.5"
psycopg = { extras = ["binary"], version = "^3.2.10" }
redis = "^5.2.1"
celery = "^5.5.3"
boto3 = "^1.40.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
ruff = "^0.12.0"
pre-commit = "^4.5.1"
pytest-cov = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "unit: Fast tests that do not require external infrastructure.",
    "integration: Tests that validate integration of multiple components.",
]

[tool.coverage.run]
source = ["backend.app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
