target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [".idea", ".venv", "venv", "__pycache__", "backend/alembic"]

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "RET",
  "ARG",
  "PTH",
  "RUF",
  "S",
  "ASYNC",
  "DTZ",
  "PL",
  "TRY",
  "ANN",
  "D",
]
ignore = ["D203", "D213", "COM812", "ISC001", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "D", "PLR2004"]
"backend/app/api/deps.py" = ["TRY003"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
