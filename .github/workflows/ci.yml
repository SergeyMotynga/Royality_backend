name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: royality
          POSTGRES_PASSWORD: royality
          POSTGRES_DB: royality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U royality -d royality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_TITLE: Royality Backend
      ENV: ci
      LOG_LEVEL: INFO
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      POSTGRES_USER: royality
      POSTGRES_PASSWORD: royality
      POSTGRES_DB: royality
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://royality:royality@localhost:5432/royality
      MINIO_ROOT_USER: ci-minio-user
      MINIO_ROOT_PASSWORD: ci-minio-password
      MINIO_ENDPOINT: localhost:9000
      MINIO_API_PORT: "9000"
      MINIO_CONSOLE_PORT: "9001"
      MINIO_BUCKET_NAME: royality-media
      MINIO_REGION: us-east-1
      MINIO_SECURE: "false"
      DOCKER_APP_HOST: 0.0.0.0
      DOCKER_APP_PORT: "8000"
      DOCKER_POSTGRES_HOST: postgres
      DOCKER_POSTGRES_PORT: "5432"
      DOCKER_DATABASE_URL: postgresql+psycopg://royality:royality@postgres:5432/royality
      DOCKER_MINIO_ENDPOINT: minio:9000
      DOCKER_MINIO_SECURE: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка Poetry
        run: python -m pip install --upgrade pip && python -m pip install poetry==2.3.2

      - name: Конфигурация Poetry
        run: |
          poetry config virtualenvs.in-project true --local
          poetry config virtualenvs.use-poetry-python true --local

      - name: Установка зависимостей
        run: poetry install --with dev

      - name: Подготовка .env
        run: cp .env.example .env

      - name: Валидация docker-compose
        run: |
          docker compose --env-file .env -f royality/docker-compose.local.yml config -q
          docker compose --env-file .env -f royality/docker-compose.local.yml --profile backend config -q

      - name: Проверка форматирования Ruff
        run: poetry run ruff format --check .

      - name: Линт Ruff
        run: poetry run ruff check .

      - name: Тесты и покрытие
        run: poetry run pytest --cov=backend.app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Проверка миграций Alembic
        run: poetry run alembic -c alembic.ini upgrade head
