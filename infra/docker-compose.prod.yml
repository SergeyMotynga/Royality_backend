services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: finguru-backend
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      - postgres
      - redis
      # Опциональные зависимости для async/OCR (включайте профили при необходимости).
      # - rabbitmq
      # - minio
      # - minio_init
    restart: unless-stopped

  postgres:
    image: postgres:17.2-alpine
    container_name: finguru-postgres
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: finguru-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Опционально: асинхронный стек (broker для Celery). По умолчанию отключен.
  rabbitmq:
    profiles: ["async"]
    image: rabbitmq:3.13.7-management-alpine
    container_name: finguru-rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Опционально: object storage для загрузки файлов / OCR-артефактов. По умолчанию отключен.
  minio:
    profiles: ["ocr"]
    image: minio/minio:latest
    container_name: finguru-minio
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Опционально: инициализация бакетов для профиля MinIO. По умолчанию отключена.
  minio_init:
    profiles: ["ocr"]
    image: minio/mc:latest
    container_name: finguru-minio-init
    env_file:
      - ../.env
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          echo "ожидание MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/$$S3_BUCKET_MEDIA
        mc mb --ignore-existing local/$$S3_BUCKET_AVATARS
        mc anonymous set none local/$$S3_BUCKET_MEDIA
        mc anonymous set none local/$$S3_BUCKET_AVATARS
        echo "бакеты MinIO инициализированы"
    restart: "no"

  # Опционально: процесс async-воркера. По умолчанию отключен.
  celery_worker:
    profiles: ["async"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: finguru-celery-worker
    env_file:
      - ../.env
    command:
      - python
      - -c
      - |
        import time
        print("[TODO-INFRA-STUB] замените на команду запуска celery worker")
        time.sleep(10**9)
    depends_on:
      - postgres
      - redis
      - rabbitmq
      # Опционально, если воркер использует OCR/задачи file-storage.
      # - minio
      # - minio_init
    restart: unless-stopped

  # Опционально: процесс планировщика. По умолчанию отключен.
  celery_beat:
    profiles: ["async"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: finguru-celery-beat
    env_file:
      - ../.env
    command:
      - python
      - -c
      - |
        import time
        print("[TODO-INFRA-STUB] замените на команду запуска celery beat")
        time.sleep(10**9)
    depends_on:
      - postgres
      - redis
      - rabbitmq
    restart: unless-stopped

  # Опционально: процесс outbox relay. По умолчанию отключен.
  outbox_relay:
    profiles: ["async"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: finguru-outbox-relay
    env_file:
      - ../.env
    command:
      - python
      - -c
      - |
        import time
        print("[TODO-INFRA-STUB] замените на команду запуска outbox relay")
        time.sleep(10**9)
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
