name: royality

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${ROYALITY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ROYALITY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROYALITY_POSTGRES_DB}
    ports:
      - "${ROYALITY_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${ROYALITY_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ROYALITY_MINIO_ROOT_PASSWORD}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "${ROYALITY_MINIO_API_PORT}:9000"
      - "${ROYALITY_MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${ROYALITY_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${ROYALITY_MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${ROYALITY_MINIO_BUCKET_NAME}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Ожидание запуска MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME
        mc anonymous set download local/$$MINIO_BUCKET_NAME
        echo "Бакет MinIO инициализирован: $$MINIO_BUCKET_NAME"
    restart: "no"

  backend:
    profiles: ["backend"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ROYALITY_APP_TITLE: ${ROYALITY_APP_TITLE}
      ROYALITY_ENV: ${ROYALITY_ENV}
      ROYALITY_LOG_LEVEL: ${ROYALITY_LOG_LEVEL}
      ROYALITY_SECRET_KEY: ${ROYALITY_SECRET_KEY}
      ROYALITY_APP_HOST: ${ROYALITY_DOCKER_APP_HOST}
      ROYALITY_APP_PORT: ${ROYALITY_DOCKER_APP_PORT}
      ROYALITY_POSTGRES_USER: ${ROYALITY_POSTGRES_USER}
      ROYALITY_POSTGRES_PASSWORD: ${ROYALITY_POSTGRES_PASSWORD}
      ROYALITY_POSTGRES_DB: ${ROYALITY_POSTGRES_DB}
      ROYALITY_POSTGRES_HOST: ${ROYALITY_DOCKER_POSTGRES_HOST}
      ROYALITY_POSTGRES_PORT: ${ROYALITY_DOCKER_POSTGRES_PORT}
      ROYALITY_DATABASE_URL: ${ROYALITY_DOCKER_DATABASE_URL}
      ROYALITY_MINIO_ROOT_USER: ${ROYALITY_MINIO_ROOT_USER}
      ROYALITY_MINIO_ROOT_PASSWORD: ${ROYALITY_MINIO_ROOT_PASSWORD}
      ROYALITY_MINIO_ENDPOINT: ${ROYALITY_DOCKER_MINIO_ENDPOINT}
      ROYALITY_MINIO_PUBLIC_ENDPOINT: ${ROYALITY_DOCKER_MINIO_PUBLIC_ENDPOINT:-}
      ROYALITY_MINIO_BUCKET_NAME: ${ROYALITY_MINIO_BUCKET_NAME}
      ROYALITY_MINIO_REGION: ${ROYALITY_MINIO_REGION}
      ROYALITY_MINIO_SECURE: ${ROYALITY_DOCKER_MINIO_SECURE}
    ports:
      - "${ROYALITY_DOCKER_APP_PORT}:${ROYALITY_DOCKER_APP_PORT}"
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:app
      - --host
      - ${ROYALITY_DOCKER_APP_HOST}
      - --port
      - ${ROYALITY_DOCKER_APP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
